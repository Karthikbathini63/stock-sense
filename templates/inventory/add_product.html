{% extends "inventory/base.html" %}

{% block title %}Add Product - StockSense{% endblock %}

{% block page_title %}Add Product{% endblock %}

{% block content %}

<h2>Add New Product</h2>

{% if error %}
<div class="alert alert-danger mb-3" style="max-width: 520px;">
    {{ error }}
</div>
{% endif %}

<div class="card p-4" style="max-width: 520px;">

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">SKU</label>
            <input type="text"
                   class="form-control"
                   name="sku"
                   value="{{ form_data.sku|default:'' }}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Product Name</label>
            <input type="text"
                   class="form-control"
                   name="name"
                   value="{{ form_data.name|default:'' }}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Category</label>

            <select class="form-select" name="category" required>

                <option value="">Select Category</option>

                {% for category in categories %}
                    <option value="{{ category.id }}"
                            {% if form_data.category == category.id|stringformat:"s" %}selected{% endif %}>
                        {{ category.name }}
                    </option>
                {% endfor %}

            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Unit of Measure</label>
            <input type="text"
                   class="form-control"
                   name="unit_of_measure"
                   placeholder="Pieces"
                   value="{{ form_data.unit_of_measure|default:'' }}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control"
                      name="description">{{ form_data.description|default:'' }}</textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Reorder Level</label>
            <input type="number"
                   class="form-control"
                   name="reorder_level"
                   min="0"
                   value="{{ form_data.reorder_level|default:'0' }}"
                   required>
        </div>

        <button type="submit" class="btn btn-primary me-2">
            Add Product
        </button>

        <a href="{% url 'product_list' %}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
