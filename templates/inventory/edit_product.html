{% extends "inventory/base.html" %}

{% block title %}Edit Product - StockSense{% endblock %}

{% block page_title %}Edit Product{% endblock %}

{% block content %}

<h2>Edit Product</h2>

{% if error %}
<div class="alert alert-danger mb-3" style="max-width: 520px;">
    {{ error }}
</div>
{% endif %}

<div class="card p-4" style="max-width: 520px;">

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">SKU</label>
            <input type="text"
                   class="form-control"
                   name="sku"
                   value="{% if form_data %}{{ form_data.sku }}{% else %}{{ product.sku }}{% endif %}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Product Name</label>
            <input type="text"
                   class="form-control"
                   name="name"
                   value="{% if form_data %}{{ form_data.name }}{% else %}{{ product.name }}{% endif %}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Category</label>

            <select class="form-select" name="category" required>

                {% for category in categories %}

                    <option value="{{ category.id }}"
                        {% if form_data %}
                            {% if form_data.category == category.id|stringformat:"s" %}
                                selected
                            {% endif %}
                        {% else %}
                            {% if category.id == product.category.id %}
                                selected
                            {% endif %}
                        {% endif %}>
                        {{ category.name }}
                    </option>

                {% endfor %}

            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Unit of Measure</label>
            <input type="text"
                   class="form-control"
                   name="unit_of_measure"
                   value="{% if form_data %}{{ form_data.unit_of_measure }}{% else %}{{ product.unit_of_measure }}{% endif %}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control"
                      name="description">{% if form_data %}{{ form_data.description }}{% else %}{{ product.description }}{% endif %}</textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Reorder Level</label>
            <input type="number"
                   class="form-control"
                   name="reorder_level"
                   min="0"
                   value="{% if form_data %}{{ form_data.reorder_level }}{% else %}{{ product.reorder_level }}{% endif %}"
                   required>
        </div>

        <button type="submit" class="btn btn-primary me-2">
            Save Changes
        </button>

        <a href="{% url 'product_list' %}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
